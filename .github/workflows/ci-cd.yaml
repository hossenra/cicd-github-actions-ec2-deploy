
name: Node.js CI/CD to AWS EC2

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    name: Lint, Test and Health Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run Unit Tests
        run: npm test

      - name: Start Application
        run: |
          nohup npm start > app.log 2>&1 &
          echo $! > app.pid

      - name: Application Health Check
        run: |
          for i in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:3000/health; then
              echo "Application is healthy!"
              exit 0
            fi

            echo "Waiting for application... ($i/30)"
            sleep 2
          done

          echo "Application failed health check"
          cat app.log
          exit 1

  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest
    needs: ci

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_HOST_FINGERPRINT: ${{ vars.EC2_HOST_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

          test -n "$EC2_HOST_FINGERPRINT" || {
            echo "Set EC2_HOST_FINGERPRINT repository variable"
            exit 1
          }

          ssh-keyscan -t ed25519 -H "$EC2_HOST" \
            > ~/.ssh/known_hosts 2>/dev/null

          ssh-keygen -lf ~/.ssh/known_hosts -E sha256 \
            | grep -F "$EC2_HOST_FINGERPRINT" || {
              echo "EC2 SSH host fingerprint mismatch"
              exit 1
            }

          chmod 600 ~/.ssh/known_hosts

      - name: Copy Application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          tar --exclude=.git \
              --exclude=node_modules \
              --exclude=.github \
              --exclude=app.log \
              -czf /tmp/app.tar.gz .

          scp -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            /tmp/app.tar.gz \
            ubuntu@"$EC2_HOST":/tmp/app.tar.gz

      - name: Deploy and Restart Application
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=yes \
            ubuntu@"$EC2_HOST" 'bash -se' <<'EOF'
          set -euo pipefail

          APP_DIR="$HOME/node-cicd-app"

          mkdir -p "$APP_DIR"
          cd "$APP_DIR"

          tar -xzf /tmp/app.tar.gz

          npm ci --omit=dev

          if [ -f app.pid ]; then
            OLD_PID=$(cat app.pid)
            kill "$OLD_PID" 2>/dev/null || true
            rm -f app.pid
          fi

          # Stop any previous instance on port 3000
          if command -v fuser >/dev/null 2>&1; then
            fuser -k 3000/tcp 2>/dev/null || true
          fi

          nohup npm start > app.log 2>&1 < /dev/null &
          echo $! > app.pid

          echo "Waiting for EC2 application..."

          for i in {1..30}; do
            if curl --fail --silent \
              http://127.0.0.1:3000/health; then
              echo "EC2 deployment successful!"
              exit 0
            fi

            echo "Waiting... ($i/30)"
            sleep 2
          done

          echo "EC2 deployment health check failed"
          cat app.log
          exit 1
          EOF

      - name: Deployment Complete
        run: echo "CI/CD pipeline completed successfully!"
