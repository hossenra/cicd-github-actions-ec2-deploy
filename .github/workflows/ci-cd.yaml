
name: CI/CD - Node.js to AWS EC2

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  # -----------------------------
  # JOB 1: LINT
  # -----------------------------
  lint:
    name: Lint Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Lint
        run: npm run lint

  # -----------------------------
  # JOB 2: UNIT TESTS
  # -----------------------------
  test:
    name: Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Run Unit Tests
        run: npm test

  # -----------------------------
  # JOB 3: DEPLOY TO AWS EC2
  # -----------------------------
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    needs:
      - lint
      - test

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    environment: production

    concurrency:
      group: ec2-production
      cancel-in-progress: false

    steps:
      - name: Configure SSH Private Key
        env:
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key

      - name: Deploy Application to EC2
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
        run: |
          ssh -i ~/.ssh/ec2_key \
            -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=30 \
            "$EC2_USER@$EC2_HOST" \
            "bash /opt/cicd-demo/deploy.sh"

      - name: Deployment Completed
        run: |
          echo "Deployment to AWS EC2 completed successfully!"
